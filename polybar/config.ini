[bar/top]
monitor = DP-0
width = 100%
height = 32

background = #00000000
foreground = #ccffffff

line-color = ${bar/bottom.background}
line-size = 2

spacing = 2
padding-right = 8
module-margin-left = 1
module-margin-right = 1

font-0 = "JetBrainsMono Nerd Font:size=10;-1"
font-1 = "FontAwesome:size=10;0"
font-2 = "MaterialIcons:size=10;0"

modules-left = powermenu player
modules-right = volume separator wireless-network separator date separator time

