[module/i3]
type = internal/i3
format = <label-state>

label-focused = %icon% %name%
label-focused-foreground = #ffffff
label-focused-background = #5e81ac
label-focused-padding = 2

label-unfocused = %icon% %name%
label-unfocused-foreground = #bbbbbb
label-unfocused-padding = 2

label-visible = %icon% %name%
label-visible-foreground = #88c0d0
label-visible-padding = 2

label-urgent = %icon% %name%
label-urgent-foreground = #2e3440
label-urgent-background = #bf616a
label-urgent-padding = 3

[module/bspwm-tmp]
type = internal/bspwm
format = <label-state>

label-active = 
label-active-padding = 1
label-occupied = 
label-occupied-padding = 1
label-empty = 
label-empty-padding = 1

[module/cpu]
type = internal/cpu
interval = 0.5
format = <label> <ramp-coreload>
label = CPU

ramp-coreload-0 = ▁
ramp-coreload-0-font = 6
ramp-coreload-0-foreground = #aaff77
ramp-coreload-1 = ▂
ramp-coreload-1-font = 6
ramp-coreload-1-foreground = #aaff77
ramp-coreload-2 = ▃
ramp-coreload-2-font = 6
ramp-coreload-2-foreground = #fba922
ramp-coreload-3 = ▄
ramp-coreload-3-font = 6
ramp-coreload-3-foreground = #fba922
ramp-coreload-4 = ▅
ramp-coreload-4-font = 6
ramp-coreload-4-foreground = #ff5555
ramp-coreload-5 = ▆
ramp-coreload-5-font = 6
ramp-coreload-5-foreground = #ff5555
ramp-coreload-6 = ▇
ramp-coreload-6-font = 6
ramp-coreload-6-foreground = #ff5555
ramp-coreload-7 = █
ramp-coreload-7-font = 6
ramp-coreload-7-foreground = #ff5555

[module/date]
type = internal/date
interval = 2
date = %{T1}%{T-} %a, %b %d
date-alt = %A, %d %B %Y  %H:%M:%S

[module/time]
type = internal/date
interval = 2
date = %{T1}%{T-} %I:%M %p
date-alt = %A, %d %B %Y  %H:%M:%S

[module/memory]
type = internal/memory
format = <label> <bar-used>
label = RAM

bar-used-width = 30
bar-used-indicator = |
bar-used-indicator-font = 6
bar-used-indicator-foreground = #ff

bar-used-fill = ─
bar-used-fill-font = 6
bar-used-fill-foreground-0 = #aaff77
bar-used-fill-foreground-1 = #fba922
bar-used-fill-foreground-2 = #ff5555

bar-used-empty = ─
bar-used-empty-font = 6
bar-used-empty-foreground = #444444

[module/mpd]
type = internal/mpd
format-online = <icon-prev> <icon-stop> <toggle> <icon-next>  <icon-repeat> <icon-random>  <bar-progress> <label-time>  <label-song>

icon-play = 
icon-pause = 
icon-stop = 
icon-prev = 
icon-next = 
icon-random = 
icon-repeat = 

toggle-on-foreground =
toggle-off-foreground = #55

bar-progress-width = 45
bar-progress-format = %{A4:mpdseek+2: A5:mpdseek-2:}%fill%%indicator%%empty%%{A A}
bar-progress-indicator = |
bar-progress-indicator-foreground = #ff
bar-progress-indicator-font = 3
bar-progress-fill = ─
bar-progress-fill-foreground = #bb
bar-progress-fill-font = 3
bar-progress-empty = ─
bar-progress-empty-font = 3
bar-progress-empty-foreground = #44

[module/wireless-network]
type = internal/network
interface = wlan0
interval = 3.0
ping-interval = 10

format-connected =   <label-connected>
label-connected = %essid%
label-disconnected = 睊  not connected
label-disconnected-foreground = #666

; [module/wired-network]
; type = internal/network
; interface = enp6s0
; interval = 3.0
;
; label-connected =    %{T3}%local_ip%%{T-}
; label-disconnected-foreground = #66

[module/volume]
type = internal/pulseaudio
sink = @DEFAULT_SINK@

format-volume = <ramp-volume><label-volume>
label-muted =  muted
label-muted-foreground = #66

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 

click-left = pactl set-sink-mute bluez_output.88_C9_E8_74_07_95.1 toggle
scroll-up = pactl set-sink-volume bluez_output.88_C9_E8_74_07_95.1 +5%
scroll-down = pactl set-sink-volume bluez_output.88_C9_E8_74_07_95.1 -5%

[module/powermenu]
type = custom/menu

format-padding = 5

label-open = 
label-close = 

menu-0-0 = Terminate WM
menu-0-0-foreground = #fba922
menu-0-0-exec = bspc quit -1
menu-0-1 = Reboot
menu-0-1-foreground = #fba922
menu-0-1-exec = menu_open-1
menu-0-2 = Power off
menu-0-2-foreground = #fba922
menu-0-2-exec = menu_open-2

menu-1-0 = Cancel
menu-1-0-foreground = #fba922
menu-1-0-exec = menu_open-0
menu-1-1 = Reboot
menu-1-1-foreground = #fba922
menu-1-1-exec = sudo reboot

menu-2-0 = Power off
menu-2-0-foreground = #fba922
menu-2-0-exec = sudo poweroff
menu-2-1 = Cancel
menu-2-1-foreground = #fba922
menu-2-1-exec = menu_open-0

[module/clock]
type = internal/date
interval = 2
date =   %%{F#99}%Y-%m-%d%%{F-} %%{F#fff}%H:%M%%{F-}

[module/player]
type = custom/script
exec = playerctl metadata --format '{{ artist }} - {{ title }}'
interval = 5

format-prefix =  .
label = %output%

[module/separator]
type = custom/text
content = %{F#444}|%{F-}

; vim:ft=dosini
