backend = "glx";
vsync = true;

corner-radius = 4;
round-borders = 4;

rounded-corners-exclude = [
  "class_g = 'i3-frame'",
  "bounding_shaped"
];

blur = {
  method = "dual_kawase";
  strength = 7;
  size = 10;
  deviation = 4.0;
};

shadow = true;
shadow-radius = 16;
shadow-opacity = 0.2;
shadow-offset-x = -8;
shadow-offset-y = -8;

shadow-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'Rofi'",
  "name = 'Notification'",
  "class_g = 'dmenu'",
  "window_type = 'desktop'"
];

fading = true;
fade-in-step = 0.035;
fade-out-step = 0.035;
fade-delta = 8;

animations = true;
animation-stiffness = 500;            # Slightly tighter for subtle motion
animation-window-mass = 0.2;
animation-clamping = true;

# 🧼 Animation style changed
animation-for-open-window = "slide-down";  # smoother entrance
animation-for-unmap-window = "fade";       # clean exit
animation-for-transient-window = "slide-down";

inactive-opacity = 0.92;
active-opacity = 1.0;
frame-opacity = 0.9;

use-damage = false;
use-dynamic-latency = true;
